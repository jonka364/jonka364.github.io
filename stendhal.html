<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Image Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.05);
      filter: brightness(1.1);
    }

    .gallery-item::after {
      content: attr(data-caption);
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      padding: 8px 10px;
      font-size: 0.85rem;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
      color: #f5f5f5;
    }

    /* Optional: limit max width for very large screens */
    .page {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 16px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>My Image Gallery</h1>
    <div class="gallery">
      <div class="gallery-item" data-caption="Image 1 description">
        <img src="knight_eland_vazir_N = 320000_selective_enmity_3199.png" alt="Image 1" loading="lazy" />
      </div>
      <div class="gallery-item" data-caption="Image 2 description">
        <img src="image2-large.jpg" alt="Image 2" loading="lazy" />
      </div>
      <div class="gallery-item" data-caption="Image 3 description">
        <img src="image3-large.jpg" alt="Image 3" loading="lazy" />
      </div>
      <!-- Add more items as needed -->
    </div>
  </div>
</body>
</html>
